name: Games checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [release/0.0.8, release/v0.0.8]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:games
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:games:mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: games-mobile-screenshots
          path: test-results/games/
          retention-days: 7
